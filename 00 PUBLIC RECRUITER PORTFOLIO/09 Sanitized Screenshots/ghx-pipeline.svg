<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="ghxTitle ghxDesc">
  <title id="ghxTitle">GH-X pipeline stages</title>
  <desc id="ghxDesc">Idea to Listing to Visual to Publish to Social to Video to Feedback to Reliability</desc>
  <defs>
    <linearGradient id="ghxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f5c48"/>
      <stop offset="100%" stop-color="#5a7a5e"/>
    </linearGradient>
  </defs>
  <rect width="960" height="220" fill="#faf8f4" rx="8"/>
  <text x="24" y="36" font-family="Georgia, serif" font-size="13" fill="#5a7a5e" font-weight="600">GH-X PIPELINE (FUNCTIONAL BUILD)</text>
  <line x1="48" y1="120" x2="912" y2="120" stroke="#c9b896" stroke-width="2" stroke-dasharray="4 4"/>
  <g font-family="Arial, sans-serif" font-size="11" text-anchor="middle">
    <g transform="translate(60,100)">
      <circle r="22" fill="url(#ghxGrad)"/>
      <text y="4" fill="#f5f2eb" font-weight="600">1</text>
      <text y="48" fill="#1c2420" font-weight="600">Idea</text>
    </g>
    <g transform="translate(180,100)">
      <circle r="22" fill="url(#ghxGrad)"/>
      <text y="4" fill="#f5f2eb" font-weight="600">2</text>
      <text y="48" fill="#1c2420" font-weight="600">Listing</text>
    </g>
    <g transform="translate(300,100)">
      <circle r="22" fill="url(#ghxGrad)"/>
      <text y="4" fill="#f5f2eb" font-weight="600">3</text>
      <text y="48" fill="#1c2420" font-weight="600">Visual</text>
    </g>
    <g transform="translate(420,100)">
      <circle r="22" fill="url(#ghxGrad)"/>
      <text y="4" fill="#f5f2eb" font-weight="600">4</text>
      <text y="48" fill="#1c2420" font-weight="600">Publish</text>
    </g>
    <g transform="translate(540,100)">
      <circle r="22" fill="url(#ghxGrad)"/>
      <text y="4" fill="#f5f2eb" font-weight="600">5</text>
      <text y="48" fill="#1c2420" font-weight="600">Social</text>
    </g>
    <g transform="translate(660,100)">
      <circle r="22" fill="url(#ghxGrad)"/>
      <text y="4" fill="#f5f2eb" font-weight="600">6</text>
      <text y="48" fill="#1c2420" font-weight="600">Video</text>
    </g>
    <g transform="translate(780,100)">
      <circle r="22" fill="url(#ghxGrad)"/>
      <text y="4" fill="#f5f2eb" font-weight="600">7</text>
      <text y="48" fill="#1c2420" font-weight="600">Feedback</text>
    </g>
    <g transform="translate(900,100)">
      <circle r="22" fill="#1c2420"/>
      <text y="4" fill="#c9b896" font-weight="600">8</text>
      <text y="48" fill="#1c2420" font-weight="600">Reliability</text>
    </g>
  </g>
  <text x="24" y="200" font-family="Arial, sans-serif" font-size="11" fill="#4a554e">Airtable queues + n8n stage orchestration - abstract diagram - not an implementable export</text>
</svg>
