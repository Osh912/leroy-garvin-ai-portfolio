<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="voiceTitle voiceDesc">
  <title id="voiceTitle">Voice booking flow - 10 stages</title>
  <desc id="voiceDesc">Greeting through professional close for AI voice booking assistant</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c9b896"/>
    </marker>
  </defs>
  <rect width="1000" height="280" fill="#faf8f4" rx="8"/>
  <text x="24" y="32" font-family="Georgia, serif" font-size="13" fill="#5a7a5e" font-weight="600">VOICE BOOKING FLOW (10 STAGES)</text>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    <g transform="translate(100,90)">
      <rect x="-70" y="-28" width="140" height="56" rx="6" fill="#3f5c48"/>
      <text y="-4" fill="#f5f2eb" font-weight="600">1. Greeting</text>
      <text y="12" fill="#c9b896">Open call</text>
    </g>
    <g transform="translate(300,90)">
      <rect x="-70" y="-28" width="140" height="56" rx="6" fill="#3f5c48"/>
      <text y="-4" fill="#f5f2eb" font-weight="600">2. Service qual.</text>
      <text y="12" fill="#c9b896">Need fit</text>
    </g>
    <g transform="translate(500,90)">
      <rect x="-70" y="-28" width="140" height="56" rx="6" fill="#3f5c48"/>
      <text y="-4" fill="#f5f2eb" font-weight="600">3. Vehicle ID</text>
      <text y="12" fill="#c9b896">Type / size</text>
    </g>
    <g transform="translate(700,90)">
      <rect x="-70" y="-28" width="140" height="56" rx="6" fill="#3f5c48"/>
      <text y="-4" fill="#f5f2eb" font-weight="600">4. Pricing</text>
      <text y="12" fill="#c9b896">Quote range</text>
    </g>
    <g transform="translate(900,90)">
      <rect x="-70" y="-28" width="140" height="56" rx="6" fill="#3f5c48"/>
      <text y="-4" fill="#f5f2eb" font-weight="600">5. Price confirm</text>
      <text y="12" fill="#c9b896">Checkpoint</text>
    </g>
    <path d="M170 90 H230" stroke="#c9b896" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M370 90 H430" stroke="#c9b896" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M570 90 H630" stroke="#c9b896" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M770 90 H830" stroke="#c9b896" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <g transform="translate(100,200)">
      <rect x="-70" y="-28" width="140" height="56" rx="6" fill="#5a7a5e"/>
      <text y="-4" fill="#f5f2eb" font-weight="600">6. Customer name</text>
      <text y="12" fill="#e8dfd0">Collect</text>
    </g>
    <g transform="translate(300,200)">
      <rect x="-70" y="-28" width="140" height="56" rx="6" fill="#5a7a5e"/>
      <text y="-4" fill="#f5f2eb" font-weight="600">7. Address / ZIP</text>
      <text y="12" fill="#e8dfd0">Location</text>
    </g>
    <g transform="translate(500,200)">
      <rect x="-70" y="-28" width="140" height="56" rx="6" fill="#5a7a5e"/>
      <text y="-4" fill="#f5f2eb" font-weight="600">8. Appointment</text>
      <text y="12" fill="#e8dfd0">Offer times</text>
    </g>
    <g transform="translate(700,200)">
      <rect x="-70" y="-28" width="140" height="56" rx="6" fill="#5a7a5e"/>
      <text y="-4" fill="#f5f2eb" font-weight="600">9. Confirmation</text>
      <text y="12" fill="#e8dfd0">Lock details</text>
    </g>
    <g transform="translate(900,200)">
      <rect x="-70" y="-28" width="140" height="56" rx="6" fill="#1c2420"/>
      <text y="-4" fill="#c9b896" font-weight="600">10. Close</text>
      <text y="12" fill="#e8dfd0">Professional</text>
    </g>
    <path d="M170 200 H230" stroke="#c9b896" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M370 200 H430" stroke="#c9b896" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M570 200 H630" stroke="#c9b896" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M770 200 H830" stroke="#c9b896" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M900 118 V150 H100 V172" stroke="#c9b896" stroke-width="2" fill="none" stroke-dasharray="3 3"/>
  </g>
  <text x="24" y="262" font-family="Arial, sans-serif" font-size="11" fill="#4a554e">One-question-at-a-time - stage control - confirmation checkpoints - proprietary prompts withheld</text>
</svg>
