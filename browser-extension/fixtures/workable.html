<!DOCTYPE html>
<html lang="en" data-jm-fixture-platform="workable">
<head><meta charset="utf-8"><title>Workable Fixture</title></head>
<body data-jm-fixture-platform="workable">
  <h1>Workable Application Fixture</h1>
  <form id="application-form" class="application-form">
    <label>First Name <input name="firstname" id="firstname"></label>
    <label>Last Name <input name="lastname" id="lastname"></label>
    <label>Email <input name="email" type="email"></label>
    <label>Phone <input name="phone" type="tel"></label>
    <label>City <input name="city"></label>
    <label>LinkedIn URL <input name="linkedin"></label>
    <label>Portfolio / Website <input name="website"></label>
    <label>Resume <input type="file" name="resume"></label>
    <label>Cover Letter <input type="file" name="cover_letter"></label>
    <label>Why are you interested in this company?
      <textarea name="why_company"></textarea>
    </label>
    <label>What tools have you used?
      <textarea name="tools"></textarea>
    </label>
    <label>Are you authorized to work in the United States?
      <select name="work_auth"><option></option><option>Yes</option><option>No</option></select>
    </label>
    <label>Willingness to relocate
      <select name="relocate"><option></option><option>Yes</option><option>No</option></select>
    </label>
    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
