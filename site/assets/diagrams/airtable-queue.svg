<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="atTitle atDesc">
  <title id="atTitle">Airtable queue architecture</title>
  <desc id="atDesc">Queue tables feed n8n stages and QA notes in a loop</desc>
  <defs>
    <marker id="mArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c9b896"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#faf8f4" rx="8"/>
  <text x="24" y="36" font-family="Georgia, serif" font-size="13" fill="#5a7a5e" font-weight="600">AIRTABLE QUEUE LAYER</text>
  <rect x="60" y="80" width="200" height="140" rx="10" fill="#fff" stroke="#3f5c48" stroke-width="2"/>
  <text x="160" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1c2420">Queue Tables</text>
  <text x="160" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a554e">Stages / Statuses</text>
  <text x="160" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a554e">Work item fields</text>
  <text x="160" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a554e">References</text>
  <rect x="400" y="70" width="200" height="100" rx="10" fill="#3f5c48"/>
  <text x="500" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#f5f2eb">n8n Stages</text>
  <text x="500" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c9b896">Read - Act - Write</text>
  <rect x="400" y="200" width="200" height="80" rx="10" fill="#1c2420"/>
  <text x="500" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#c9b896">Issue / QA Notes</text>
  <text x="500" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e8dfd0">Classify - Fix - Retest</text>
  <path d="M260 130 H390" stroke="#c9b896" stroke-width="2.5" fill="none" marker-end="url(#mArrow)"/>
  <path d="M390 160 H280" stroke="#c9b896" stroke-width="2.5" fill="none" marker-end="url(#mArrow)" stroke-dasharray="5 4"/>
  <text x="325" y="120" font-family="Arial, sans-serif" font-size="10" fill="#5a7a5e" font-weight="600">pull</text>
  <text x="310" y="178" font-family="Arial, sans-serif" font-size="10" fill="#5a7a5e" font-weight="600">status</text>
  <path d="M160 220 V250 H390" stroke="#c9b896" stroke-width="2" fill="none" marker-end="url(#mArrow)"/>
  <text x="250" y="245" font-family="Arial, sans-serif" font-size="10" fill="#5a7a5e">QA loop</text>
  <text x="24" y="300" font-family="Arial, sans-serif" font-size="11" fill="#4a554e">Structure described publicly - private base contents not published</text>
</svg>
