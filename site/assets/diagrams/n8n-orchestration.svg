<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="n8nTitle n8nDesc">
  <title id="n8nTitle">n8n orchestration pattern</title>
  <desc id="n8nDesc">Trigger validate optional AI branch write status to Airtable</desc>
  <rect width="800" height="200" fill="#faf8f4" rx="8"/>
  <text x="24" y="32" font-family="DM Sans, sans-serif" font-size="13" fill="#5a7a5e" font-weight="600" letter-spacing="1.5">N8N ORCHESTRATION PATTERN</text>
  <defs>
    <marker id="nArr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3f5c48"/>
    </marker>
  </defs>
  <g font-family="DM Sans, sans-serif" font-size="12" text-anchor="middle">
    <g transform="translate(90,110)">
      <rect x="-65" y="-32" width="130" height="64" rx="8" fill="#fff" stroke="#3f5c48" stroke-width="2"/>
      <text y="-2" fill="#1c2420" font-weight="600">Trigger</text>
      <text y="16" fill="#4a554e" font-size="10">Schedule / event</text>
    </g>
    <path d="M155 110 H210" stroke="#3f5c48" stroke-width="2" marker-end="url(#nArr)"/>
    <g transform="translate(280,110)">
      <rect x="-65" y="-32" width="130" height="64" rx="8" fill="#3f5c48"/>
      <text y="-2" fill="#f5f2eb" font-weight="600">Validate</text>
      <text y="16" fill="#c9b896" font-size="10">Queue item</text>
    </g>
    <path d="M345 110 H400" stroke="#3f5c48" stroke-width="2" marker-end="url(#nArr)"/>
    <g transform="translate(470,110)">
      <rect x="-65" y="-32" width="130" height="64" rx="8" fill="#5a7a5e"/>
      <text y="-2" fill="#f5f2eb" font-weight="600">AI / API</text>
      <text y="16" fill="#e8dfd0" font-size="10">Optional step</text>
    </g>
    <path d="M535 110 H590" stroke="#3f5c48" stroke-width="2" marker-end="url(#nArr)"/>
    <g transform="translate(660,110)">
      <rect x="-70" y="-42" width="140" height="84" rx="8" fill="#1c2420"/>
      <text y="-8" fill="#c9b896" font-weight="600">Branch ’ Write</text>
      <text y="12" fill="#e8dfd0" font-size="10">Quality / status</text>
      <text y="28" fill="#e8dfd0" font-size="10">’ Airtable</text>
    </g>
  </g>
  <text x="24" y="182" font-family="DM Sans, sans-serif" font-size="11" fill="#4a554e">Capability view · workflow JSON exports are private-only</text>
</svg>
